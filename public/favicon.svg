<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The SW mark for the browser tab, with no background: the letters drawn
       as strokes (a tab icon cannot load the site's fonts) over the accent
       line. The letters follow the browser's theme, dark ink on a light tab
       bar and light on a dark one, so they never vanish into it. -->
  <style>
    .ink { stroke: #16122b; }
    .line { stroke: #7c3aed; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f4f1ff; }
      .line { stroke: #7cf7d4; }
    }
  </style>
  <g class="ink" fill="none" stroke-width="5.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M27.4 16.6C25.7 14.3 22.8 13 19.3 13 14.6 13 11.6 15.6 11.6 19.2c0 7.9 16.3 4.5 16.3 12.2 0 3.8-3.3 6.2-8.3 6.2-3.9 0-7.1-1.5-8.6-4.1"/>
    <path d="M32.6 13.4l5 24.2 5.7-17.5 5.7 17.5 5-24.2"/>
  </g>
  <path class="line" d="M11.5 50h41" stroke-width="4.4" stroke-linecap="round"/>
</svg>
